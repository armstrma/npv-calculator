name: Netlify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 6d18d069-c021-49f7-ab08-36ec5636bf5b
  VITE_SUPABASE_URL: https://uhiazxydcuxdihtgfkxg.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_N9BHG9xgYZCZl9D1T8J0uQ_sZyerA3O
  VITE_PASSKEYS_ENABLED: 'true'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Verify preview test mode is absent from production builds
        run: npm run assert:production-preview-free

      - name: Build preview
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          VITE_PREVIEW_TEST_MODE: 'true'

      - name: Verify preview build includes test mode
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          blobs = [p.read_text(errors='replace') for p in list(dist.rglob('*.js')) + list(dist.rglob('*.css')) + list(dist.rglob('*.html'))]
          text = '\n'.join(blobs)
          required = ('Preview test mode', 'Preview tester', 'npvPreviewCloud', 'npvPreviewPro')
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Preview build is missing test-mode markers: {missing}')
          print('Preview build includes test mode.')
          PY

      - name: Build production
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        # Current netlify-cli re-runs build.command (in production context) unless
        # --no-build is set, which would overwrite the preview-flagged dist.
        run: npx --yes netlify-cli deploy --no-build --dir=dist --functions=netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --alias "$NETLIFY_DEPLOY_ALIAS" --message "$NETLIFY_DEPLOY_MESSAGE"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_DEPLOY_ALIAS: pr-${{ github.event.pull_request.number }}
          NETLIFY_DEPLOY_MESSAGE: 'PR #${{ github.event.pull_request.number }}'

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx --yes netlify-cli deploy --prod --no-build --dir=dist --functions=netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "main@${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
